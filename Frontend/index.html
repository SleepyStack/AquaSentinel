<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aqua Sentinel - Live Map & Hazard Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-water"></i> Aqua Sentinel</h1>
        <nav>
            <button id="tab-map" class="tab-btn active">Live Map</button>
            <button id="tab-report" class="tab-btn">Report Hazard</button>
        </nav>
    </header>

    <main>
        <!-- Live Map Section -->
        <section id="section-map">
            <h2><i class="fas fa-map"></i> Live Map</h2>
            <div id="map"></div>
        </section>

        <!-- Report Hazard Section -->
        <section id="section-report" style="display:none;">
            <h2><i class="fas fa-plus-circle"></i> Submit Hazard Report</h2>
            <form id="reportForm">
                <label for="hazardType">Hazard Type</label>
                <select id="hazardType" required>
                    <option value="">Select...</option>
                    <option value="tsunami">Tsunami</option>
                    <option value="storm_surge">Storm Surge</option>
                    <option value="high_waves">High Waves</option>
                    <option value="coastal_flooding">Coastal Flooding</option>
                    <option value="other">Other</option>
                </select>

                <label for="severityLevel">Severity Level</label>
                <select id="severityLevel" required>
                    <option value="">Select...</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>

                <label for="location">Location <span style="font-size:0.9em;">(lat,lon)</span></label>
                <input type="text" id="location" placeholder="e.g. 12.9716,77.5946" required>
                <button type="button" id="getLocationBtn"><i class="fas fa-location-arrow"></i> Use Current Location</button>

                <label for="description">Description</label>
                <textarea id="description" rows="3" required placeholder="Describe what you observed..."></textarea>

                <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Submit Report</button>
                <div id="spinnerContainer" style="display:none;">
                    <i id="spinnerIcon" class="fas fa-spinner fa-spin"></i>
                    <span id="spinnerText">Submitting...</span>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
