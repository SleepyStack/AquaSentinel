spring.application.name=AquaSentinel
spring.datasource.url=jdbc:mysql://sql12.freesqldatabase.com:3306/sql12797411?useSSL=false&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE

# Sets the maximum time (in milliseconds) a connection can remain idle in the pool before being closed.
spring.datasource.hikari.idle-timeout=600000 

# Sets the maximum lifetime of a connection in the pool (in milliseconds).
# Set this to be a few seconds shorter than your database's connection timeout.
spring.datasource.hikari.max-lifetime=1800000 

# Sets the maximum number of connections allowed in the pool. Adjust based on load.
spring.datasource.hikari.maximum-pool-size=10

# The maximum time (in milliseconds) that the pool will wait for a connection to be available.
spring.datasource.hikari.connection-timeout=30000

# The SQL query to use for testing the connection validity.
spring.datasource.hikari.connection-test-query=SELECT 1

# This is the "big hammer" - prints ALL Hibernate activity in extreme detail.
logging.level.org.hibernate=TRACE

# This focuses specifically on the part that builds the table creation commands.
logging.level.org.hibernate.tool.schema=TRACE

# This prints the final, clean SQL statements to the console.

# This makes the SQL printed by the line above easier to read.
spring.jpa.properties.hibernate.format_sql=true
